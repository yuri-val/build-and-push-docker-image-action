name: 'Build and Push Docker Image with Release'
description: 'Builds a Docker image and pushes it to Docker Hub, then creates a GitHub release and sends Telegram notifications.'
author: 'Yuri V <yuri.valigursky@gmail.com> (@yuri-val)'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  github_token:
    description: 'GitHub token for authentication'
    required: true
  telegram_to:
    description: 'Telegram recipient/chat ID'
    required: true
  telegram_token:
    description: 'Telegram bot token'
    required: true
  docker_hub_username:
    description: 'Docker Hub username'
    required: true
  docker_hub_access_token:
    description: 'Docker Hub access token'
    required: true
  docker_repo_name:
    description: 'Docker Hub repository name'
    required: true
  cache_tag:
    description: 'Tag in the same Docker Hub repository that stores the BuildKit layer cache (type=registry, mode=max). Shared by every runner that builds this image.'
    required: false
    default: 'buildcache'

runs:
  using: 'composite'
  steps:
    - name: Extract repository name
      shell: bash
      run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

    # Telegram is called with curl rather than a third-party action: the bot
    # token then goes to api.telegram.org and nowhere else, and there is no
    # mutable `@master` reference for someone else to repoint.
    - name: Send Telegram Message on Start
      shell: bash
      continue-on-error: true
      env:
        TELEGRAM_TO: ${{ inputs.telegram_to }}
        TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
        TEXT: "💬 <b>STARTED</b>: build <pre>${{ github.repository }}</pre>"
      run: |
        curl -sS --max-time 20 -o /dev/null -w 'Telegram: HTTP %{http_code}\n' \
          "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_TO}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}"

    - name: Get Current Date
      shell: bash
      id: date
      run: echo "date=$(date +'%y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

    # fetch-depth: 0 — the release notes below are built from git history, and
    # this checkout is what decides whether that history exists. It runs AFTER
    # the caller's own checkout and overrides it, so a workflow that carefully
    # asks for `fetch-depth: 0` still ended up with a depth-1 repo here (seen on
    # scg-softo/planvisor and sc_pms, 2026-09-08). With one commit in the
    # workspace, `git describe <tag>^` fails with "Not a valid object name" and
    # the changelog degrades to the single merge commit; every release since at
    # least 2026-08-28 was built that way, on hosted runners too.
    #
    # persist-credentials: false — nothing below pushes with git (the tag and
    # the release go through the API), and a persisted token sits in the
    # workspace that is the Docker build context below: a Dockerfile with
    # `COPY . .` and no .dockerignore for .git would bake it into the image.
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get Current Commit SHA
      shell: bash
      id: get_sha
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.docker_hub_username }}
        password: ${{ inputs.docker_hub_access_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and Push Docker Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: |
          ${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ steps.date.outputs.date }}
          ${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:latest
        build-args: |
          COMMIT_SHA=${{ steps.get_sha.outputs.sha }}
          TAG_VERSION=${{ steps.date.outputs.date }}
        # Registry cache instead of a local directory. On GitHub-hosted runners /tmp
        # starts empty, so the old `type=local,src=/tmp/.buildx-cache` never hit and
        # every build recompiled the dependency layers from scratch (planvisor:
        # ~5.5 min of a 7.5 min job); on self-hosted runners it grew without bound.
        # `mode=max` also caches the intermediate stages of multi-stage Dockerfiles.
        cache-from: type=registry,ref=${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ inputs.cache_tag }}
        cache-to: type=registry,ref=${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ inputs.cache_tag }},mode=max

    # Before the new tag is created, so it does not matter whether that tag has
    # reached the local repository yet: the most recent tag reachable from HEAD
    # is the previous release. `HEAD^` rather than `HEAD` so that re-running a
    # build whose tag already points at HEAD still finds the release before it.
    - name: Get previous tag
      id: get_previous_tag
      shell: bash
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
          || git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
        echo "Previous tag: ${PREVIOUS_TAG:-none found}"
        echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

    # Created with the first-party github-script instead of a third-party tag
    # action, so no outside code is handed a token that can write the repo.
    - name: Bump Version and Push Tag
      id: tag_version
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TAG: ${{ steps.date.outputs.date }}
        SHA: ${{ steps.get_sha.outputs.sha }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { owner, repo } = context.repo;
          const tag = process.env.TAG;
          const sha = process.env.SHA;
          try {
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            core.info(`Created tag ${tag} at ${sha}`);
          } catch (error) {
            if (error.status !== 422) throw error;
            // A re-run within the same minute: fine if the tag already marks
            // this commit, an error if it marks another one.
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.object.sha !== sha) {
              throw new Error(`Tag ${tag} already exists at ${ref.object.sha}, not ${sha}.`);
            }
            core.info(`Tag ${tag} already exists at ${sha}`);
          }
          core.setOutput('new_tag', tag);

    - name: Generate changelog
      id: generate_changelog
      shell: bash
      env:
        PREVIOUS_TAG: ${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}
      run: |
        # HEAD, not the new tag: the tag is created through the API a step
        # earlier and is not necessarily in this clone yet.
        # --no-merges because "Merge pull request #101 from org/dev" says nothing
        # a reader of release notes wants; %s keeps one line per change.
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --no-merges --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD")
        else
          CHANGELOG=$(git log --no-merges --pretty=format:"- %s" -n 50 HEAD)
        fi
        CHANGELOG=$(echo "$CHANGELOG" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n\+$/\n/')
        # A random delimiter: a commit subject equal to a fixed one would end
        # the value early and inject extra step outputs.
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "CHANGELOG<<${delimiter}"
          echo "$CHANGELOG"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

    # The patch is a plain `git diff`; git is present on every runner. The former
    # `sudo apt-get install patch patchutils` step installed tools nothing used,
    # cost ~20 s on hosted runners and failed outright on self-hosted runners whose
    # service user has no sudo.
    - name: Generate patch file
      id: generate_patch
      shell: bash
      env:
        PREVIOUS_TAG: ${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}
        NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        BUILD_DATE: ${{ steps.date.outputs.date }}
      run: |
        mkdir -p diff
        if [ -n "$PREVIOUS_TAG" ]; then
          patch_file="${REPO_NAME}_${BUILD_DATE}.diff"
          echo "Generating patch between previous tag ${PREVIOUS_TAG} and current tag ${NEW_TAG}..."
          git diff "$PREVIOUS_TAG" HEAD > "diff/${patch_file}"
          echo "PATCH_PATH=diff/${patch_file}" >> "$GITHUB_OUTPUT"
          echo "PATCH_FILENAME=${patch_file}" >> "$GITHUB_OUTPUT"
          echo "Patch file generated: diff/${patch_file}"
        else
          echo "No previous tag found. Cannot generate patch file."
        fi

    - name: Create a GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        token: ${{ inputs.github_token }}
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: Build ${{ steps.date.outputs.date }}
        body: ${{ steps.generate_changelog.outputs.CHANGELOG }}
        artifacts: ${{ steps.generate_patch.outputs.PATCH_PATH }}

    - name: Send Telegram Message on Success
      if: ${{ success() }}
      shell: bash
      continue-on-error: true
      env:
        TELEGRAM_TO: ${{ inputs.telegram_to }}
        TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
        TEXT: "✅ <b>SUCCESSFUL</b>: built <pre>${{ github.repository }}</pre> version <pre>${{ steps.date.outputs.date }}</pre>"
      run: |
        curl -sS --max-time 20 -o /dev/null -w 'Telegram: HTTP %{http_code}\n' \
          "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_TO}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}"

    - name: Send Telegram Message on Failure
      if: ${{ failure() }}
      shell: bash
      continue-on-error: true
      env:
        TELEGRAM_TO: ${{ inputs.telegram_to }}
        TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
        TEXT: "❌ <b>FAIL</b>: build failed for <pre>${{ github.repository }}</pre>"
      run: |
        curl -sS --max-time 20 -o /dev/null -w 'Telegram: HTTP %{http_code}\n' \
          "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_TO}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}"
