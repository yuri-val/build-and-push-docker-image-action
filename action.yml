name: 'Build and Push Docker Image with Release'
description: 'Builds a Docker image and pushes it to Docker Hub, then creates a GitHub release and sends Telegram notifications.'
author: 'Yuri V <yuri.valigursky@gmail.com> (@yuri-val)'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  github_token:
    description: 'GitHub token for authentication'
    required: true
  telegram_to:
    description: 'Telegram recipient/chat ID'
    required: true
  telegram_token:
    description: 'Telegram bot token'
    required: true
  docker_hub_username:
    description: 'Docker Hub username'
    required: true
  docker_hub_access_token:
    description: 'Docker Hub access token'
    required: true
  docker_repo_name:
    description: 'Docker Hub repository name'
    required: true
  cache_tag:
    description: 'Tag in the same Docker Hub repository that stores the BuildKit layer cache (type=registry, mode=max). Shared by every runner that builds this image.'
    required: false
    default: 'buildcache'

runs:
  using: 'composite'
  steps:
    - name: Extract repository name
      shell: bash
      run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Send Telegram Message on Start
      uses: appleboy/telegram-action@master
      continue-on-error: true
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        format: html
        message: "💬 <b>STARTED</b>: build <pre>${{ github.repository }}</pre>"

    - name: Get Current Date
      shell: bash
      id: date
      run: echo "date=$(date +'%y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

    # fetch-depth: 0 — the release notes below are built from git history, and
    # this checkout is what decides whether that history exists. It runs AFTER
    # the caller's own checkout and overrides it, so a workflow that carefully
    # asks for `fetch-depth: 0` still ended up with a depth-1 repo here (seen on
    # scg-softo/planvisor and sc_pms, 2026-09-08). With one commit in the
    # workspace, `git describe <tag>^` fails with "Not a valid object name" and
    # the changelog degrades to the single merge commit; every release since at
    # least 2026-08-28 was built that way, on hosted runners too.
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get Current Commit SHA
      shell: bash
      id: get_sha
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker_hub_username }}
        password: ${{ inputs.docker_hub_access_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: |
          ${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ steps.date.outputs.date }}
          ${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:latest
        build-args: |
          COMMIT_SHA=${{ steps.get_sha.outputs.sha }}
          TAG_VERSION=${{ steps.date.outputs.date }}
        # Registry cache instead of a local directory. On GitHub-hosted runners /tmp
        # starts empty, so the old `type=local,src=/tmp/.buildx-cache` never hit and
        # every build recompiled the dependency layers from scratch (planvisor:
        # ~5.5 min of a 7.5 min job); on self-hosted runners it grew without bound.
        # `mode=max` also caches the intermediate stages of multi-stage Dockerfiles.
        cache-from: type=registry,ref=${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ inputs.cache_tag }}
        cache-to: type=registry,ref=${{ inputs.docker_hub_username }}/${{ inputs.docker_repo_name }}:${{ inputs.cache_tag }},mode=max

    # Before the new tag is created, so it does not matter whether that tag has
    # reached the local repository yet: the most recent tag reachable from HEAD
    # is the previous release. `HEAD^` rather than `HEAD` so that re-running a
    # build whose tag already points at HEAD still finds the release before it.
    - name: Get previous tag
      id: get_previous_tag
      shell: bash
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
          || git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
        echo "Previous tag: ${PREVIOUS_TAG:-none found}"
        echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

    - name: Bump Version and Push Tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.1
      with:
        github_token: ${{ inputs.github_token }}
        custom_tag: ${{ steps.date.outputs.date }}
        tag_prefix: ""

    - name: Generate changelog
      id: generate_changelog
      shell: bash
      run: |
        # HEAD, not the new tag: the tag is created through the API a step
        # earlier and is not necessarily in this clone yet.
        # --no-merges because "Merge pull request #101 from org/dev" says nothing
        # a reader of release notes wants; %s keeps one line per change.
        if [ -n "${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}" ]; then
          CHANGELOG=$(git log --no-merges --pretty=format:"- %s" "${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}..HEAD")
        else
          CHANGELOG=$(git log --no-merges --pretty=format:"- %s" -n 50 HEAD)
        fi
        CHANGELOG=$(echo "$CHANGELOG" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n\+$/\n/')
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # The patch is a plain `git diff`; git is present on every runner. The former
    # `sudo apt-get install patch patchutils` step installed tools nothing used,
    # cost ~20 s on hosted runners and failed outright on self-hosted runners whose
    # service user has no sudo.
    - name: Generate patch file
      id: generate_patch
      shell: bash
      run: |
        mkdir -p diff
        if [ -n "${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }}" ]; then
          echo "Generating patch between previous tag ${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }} and current tag ${{ steps.tag_version.outputs.new_tag }}..."
          git diff ${{ steps.get_previous_tag.outputs.PREVIOUS_TAG }} HEAD > "diff/${{ env.REPO_NAME }}_${{ steps.date.outputs.date }}.diff"
          echo "PATCH_PATH=diff/${REPO_NAME}_${{ steps.date.outputs.date }}.diff" >> $GITHUB_OUTPUT
          echo "PATCH_FILENAME=${REPO_NAME}_${{ steps.date.outputs.date }}.diff" >> $GITHUB_OUTPUT
          echo "Patch file generated: diff/${REPO_NAME}_${{ steps.date.outputs.date }}.diff"
        else
          echo "No previous tag found. Cannot generate patch file."
        fi

    - name: Create a GitHub Release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ inputs.github_token }}
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: Build ${{ steps.date.outputs.date }}
        body: ${{ steps.generate_changelog.outputs.CHANGELOG }}
        artifacts: ${{ steps.generate_patch.outputs.PATCH_PATH }}

    - name: Send Telegram Message on Success
      if: ${{ success() }}
      uses: appleboy/telegram-action@master
      continue-on-error: true
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        format: html
        message: "✅ <b>SUCCESSFUL</b>: built <pre>${{ github.repository }}</pre> version <pre>${{ steps.date.outputs.date }}</pre>"

    - name: Send Telegram Message on Failure
      if: ${{ failure() }}
      uses: appleboy/telegram-action@master
      continue-on-error: true
      with:
        to: ${{ inputs.telegram_to }}
        token: ${{ inputs.telegram_token }}
        format: html
        message: "❌ <b>FAIL</b>: build failed for <pre>${{ github.repository }}</pre>"
